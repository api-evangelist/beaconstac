# There is still NO first-party server-side API client SDK for the Uniqode REST API in any
# language — npm, PyPI, RubyGems, NuGet, Maven Central, crates.io and pkg.go.dev were all
# checked and none carries a Uniqode/Beaconstac HTTP client. Integrations are written directly
# against the HTTP API or through the published Postman collection.
# What DOES exist is a set of first-party npm packages published from the company's own npm
# accounts (hackers-mobstac / *-beaconstac / *-mobstac — MobStac is the company's original name):
# a Web Components card-template library, a QR rendering library, a design system, an Angular
# library and an iOS proximity SDK. `version` + `published` on every row are read from
# registry.npmjs.org, not from prose.
