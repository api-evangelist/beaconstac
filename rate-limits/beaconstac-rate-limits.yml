scope_model: per-account (limits attach to the subscription plan, not to an individual API key)
limits:
- scope: per-account
  plan: Pro
  limit: 10
  unit: requests
  window: 1s
  quota: 250000
  quota_window: 1mo
- scope: per-account
  plan: Plus
  limit: 25
  unit: requests
  window: 1s
  quota: 500000
  quota_window: 1mo
- scope: per-account
  plan: Business+
  limit: 100
  unit: requests
  window: 1s
  quota: 2000000
  quota_window: 1mo
entitlement:
  api_available_from_plan: Pro
  note: >-
    "Uniqode API is available to users on the Pro plan and above." Free, Starter and Lite plans
    have no API entitlement, so they have no rate limit because they have no access.
response_headers:
  documented: false
  observed: []
  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After header is documented, and none could be observed
    anonymously — every unauthenticated request to api.uniqode.com returns 401 before any
    throttling layer is reached. An agent cannot discover its remaining budget at runtime.
exhaustion:
