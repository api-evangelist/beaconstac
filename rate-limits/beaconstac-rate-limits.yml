# Uniqode publishes per-plan rate limits AND monthly usage quotas in the developer help-center
# article, verbatim below. It publishes NOTHING about the runtime signal — no rate-limit response
# headers, no documented 429 behaviour, no Retry-After contract — which is the part an agent
# actually needs at call time.
