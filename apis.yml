    Postman documenter and the real 96-request collection was fetchable and is now captured.
    A hosted, OAuth-protected MCP server was probed live at https://mcp.uniqode.com/mcp, with
    RFC 9728 / RFC 8414 / OIDC discovery documents on mcp.uniqode.com and auth.uniqode.com.
    Deliberately NOT emitted: SDKs (no API client library exists in any registry — the official
    npm packages are UI/rendering libraries), Idempotency (no idempotency contract), Security
    (no vulnerability disclosure program), Deprecation (a deprecated resource but no policy),
    AgentCard (no card on any host).
