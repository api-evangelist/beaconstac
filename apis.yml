apis:
- name: Uniqode QR Code API
  description: 'REST API (v2.0) to programmatically create static and dynamic QR Codes across 20+
    campaign types, apply design templates, generate codes in bulk from CSV/XLSX, manage Digital
    Business Cards, leads and wallet passes, build feedback forms, organize with tags and places,
    upload media, administer organizations and users, and register webhooks. A separate RPC
    reporting endpoint (/reporting/2.0/) returns scan performance, OS, city, location, visitor
    and time-of-day distributions. Token authentication via the Authorization header plus an
    organization id. No OpenAPI is published; the machine-readable contract is a Postman
    Collection v2.1 with 96 requests.'
