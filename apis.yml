aid: beaconstac
name: Beaconstac
description: 'Beaconstac (now Uniqode) is a B2B SaaS platform for creating, customizing, and
  tracking dynamic QR Codes and Digital Business Cards at scale, connecting physical touchpoints
  to measurable digital experiences for 50,000+ brands. Its HTTP API lets developers programmatically
  create 20+ QR Code types (static and dynamic), manage landing pages and forms, retrieve real-time
  scan analytics (device, location, timing), and configure webhooks. Authentication is a dashboard-issued
  API token sent in the Authorization header alongside an Organization ID. The company is SOC 2 Type II,
  ISO 27001:2022, HIPAA, and GDPR compliant. Formerly MobStac / Beaconstac; backed by Accel.'
