aid: beaconstac
name: Beaconstac
description: 'Beaconstac (now Uniqode) is a B2B SaaS platform for creating, customizing, and
  tracking dynamic QR Codes and Digital Business Cards at scale, connecting physical touchpoints
  to measurable digital experiences for 50,000+ brands. Its REST API (v2.0) covers QR Codes and
  templates, bulk CSV generation, Digital Business Cards, leads, wallet passes, feedback forms,
  tags, places, media, organizations, users and webhooks, plus a separate RPC reporting endpoint
  for scan analytics; the contract is published as a 96-request Postman collection rather than an
  OpenAPI. REST auth is a dashboard-issued token in the Authorization header plus an Organization
  ID, gated to the Pro plan and above at 10-100 requests/second by tier. Uniqode also runs a
  hosted, OAuth-protected MCP server at mcp.uniqode.com for QR management and analytics from
  Claude. SOC 2 Type II, ISO 27001:2022, HIPAA and GDPR compliant. Formerly MobStac / Beaconstac;
  backed by Accel.'
